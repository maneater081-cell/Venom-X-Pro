<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090e19">
<title>VENOM-X PRO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090e19;color:#edf3fc;font-family:Tahoma,Arial}
header{text-align:center;padding:22px;background:#111c2c;border-bottom:1px solid #263b50}
h1{color:#00e0ad;letter-spacing:3px;margin:0}
header p{color:#91a5bb;font-size:11px}
main{max-width:800px;margin:auto;padding:15px}
.panel{background:#111b2b;border:1px solid #26394f;border-radius:14px;padding:16px;margin-bottom:15px}
h2{font-size:16px;color:#00e0ad;margin-top:0}
textarea,input{width:100%;padding:13px;border-radius:9px;border:1px solid #34475e;background:#091321;color:white;font:14px Tahoma;margin:7px 0 12px}
textarea{min-height:100px;resize:vertical}
button{border:0;border-radius:9px;padding:12px;background:#00d9a5;color:#071710;font-weight:bold;cursor:pointer}
button.secondary{background:#263950;color:white}
button.danger{background:#492431;color:#ffc0cd}
.full{width:100%}
.agent{background:#0b1625;border:1px solid #293c52;border-radius:10px;padding:12px;margin:9px 0}
.agent strong{color:#fff}
.agent p{color:#a9b8ca;font-size:12px;line-height:1.8}
.tag{font-size:11px;color:#5fffd4;background:#143a36;padding:5px 9px;border-radius:20px}
.result{background:#0b1825;border-right:3px solid #00d9a5;padding:13px;border-radius:9px;margin-top:12px;line-height:2;font-size:13px}
.muted{color:#91a2b6;font-size:12px;line-height:1.8}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{flex:1}
#agents{margin-top:12px}
footer{text-align:center;color:#687d94;font-size:11px;padding:20px}
</style>
</head>
<body>

<header>
<h1>VENOM-X</h1>
<p>UNIFIED INTELLIGENCE COMMAND CENTER</p>
</header>

<main>

<section class="panel">
<h2>مرکز فرماندهی</h2>
<p class="muted">درخواستت را بنویس. سیستم تخصص‌های موردنیاز را شناسایی می‌کند.</p>
<textarea id="question" placeholder="مثلاً یک وب‌سایت حرفه‌ای طراحی کن..."></textarea>
<button class="full" onclick="analyze()">تحلیل و انتخاب ایجنت‌ها</button>
<div id="result"></div>
</section>

<section class="panel">
<h2>تیم تخصصی VENOM-X</h2>
<div id="team"></div>
</section>

<section class="panel">
<h2>افزودن ایجنت اختصاصی</h2>
<input id="newName" placeholder="نام ایجنت">
<input id="newRole" placeholder="تخصص ایجنت">
<textarea id="newTask" placeholder="وظایف و دستورالعمل‌های ایجنت"></textarea>
<button class="full" onclick="addAgent()">＋ افزودن به تیم</button>
</section>

<section class="panel">
<h2>مدیریت ایجنت‌های اختصاصی</h2>
<div id="customAgents"></div>
</section>

</main>

<footer>VENOM-X PRO · UNIFIED AGENT SYSTEM</footer>

<script>
const KEY = "venom_x_unified_agents";

const builtins = [
{id:"research",name:"Researcher",role:"تحقیق و جست‌وجو",task:"تحقیق، بررسی منابع و جمع‌آوری اطلاعات",keys:["تحقیق","جستجو","جست‌وجو","منبع","اینترنت","اطلاعات","خبر"]},
{id:"developer",name:"Developer",role:"برنامه‌نویسی",task:"طراحی نرم‌افزار، کدنویسی و رفع خطا",keys:["کد","برنامه","سایت","وب","اپلیکیشن","اپ","خطا","پایتون","جاوا","html","نرم افزار"]},
{id:"analyst",name:"Analyst",role:"تحلیل اطلاعات",task:"تحلیل داده‌ها، مقایسه و استخراج نتایج",keys:["تحلیل","بررسی","مقایسه","داده","آمار","نتیجه","گزارش"]},
{id:"strategist",name:"Strategist",role:"برنامه‌ریزی و مدیریت",task:"طراحی برنامه، اولویت‌بندی و مدیریت پروژه",keys:["برنامه ریزی","برنامه‌ریزی","مدیریت","پروژه","استراتژی","هدف","زمان بندی"]},
{id:"creative",name:"Creative",role:"خلاقیت و تولید محتوا",task:"ایده‌پردازی، نوشتن و تولید محتوای خلاقانه",keys:["ایده","محتوا","متن","داستان","موسیقی","آهنگ","شعر","طراحی","تصویر"]},
{id:"coordinator",name:"Coordinator",role:"هماهنگ‌کننده مرکزی",task:"تشخیص درخواست و هماهنگی تخصص‌های موردنیاز",keys:[]}
];

let custom = [];

function load(){
 try{
  const saved = JSON.parse(localStorage.getItem(KEY) || "[]");
  custom = Array.isArray(saved) ? saved : [];
 }catch(e){custom=[]}
 render();
}

function save(){
 try{
  localStorage.setItem(KEY,JSON.stringify(custom));
  return true;
 }catch(e){
  alert("ذخیره‌سازی ناموفق بود.");
  return false;
 }
}

function allAgents(){
 return [...builtins,...custom];
}

function render(){
 document.getElementById("team").innerHTML =
 builtins.map(a=>`
 <div class="agent">
 <strong>${a.name}</strong>
 <p>${a.role} — ${a.task}</p>
 <span class="tag">ایجنت اصلی</span>
 </div>`).join("");

 const area=document.getElementById("customAgents");
 area.innerHTML="";

 if(!custom.length){
  area.innerHTML='<p class="muted">هنوز ایجنت اختصاصی اضافه نکرده‌ای.</p>';
  return;
 }

 custom.forEach(a=>{
  const div=document.createElement("div");
  div.className="agent";

  const name=document.createElement("strong");
  name.textContent=a.name;

  const role=document.createElement("p");
  role.textContent=a.role+" — "+a.task;

  const btn=document.createElement("button");
  btn.className="danger";
  btn.textContent="حذف ایجنت";
  btn.onclick=()=>removeAgent(a.id);

  div.append(name,role,btn);
  area.append(div);
 });
}

function addAgent(){
 const name=document.getElementById("newName").value.trim();
 const role=document.getElementById("newRole").value.trim();
 const task=document.getElementById("newTask").value.trim();

 if(!name||!role||!task){
  alert("هر سه قسمت را کامل کن.");
  return;
 }

 custom.push({
  id:"custom_"+Date.now(),
  name,role,task
 });

 if(save()){
  document.getElementById("newName").value="";
  document.getElementById("newRole").value="";
  document.getElementById("newTask").value="";
  render();
 }
}

function removeAgent(id){
 if(!confirm("این ایجنت حذف شود؟"))return;
 const old=custom;
 custom=custom.filter(a=>a.id!==id);
 if(!save())custom=old;
 render();
}
 async function analyze(){
 const q=document.getElementById("question").value.trim();
 const output=document.getElementById("result");
 const button=document.querySelector('section.panel button.full');

 if(!q){
  alert("ابتدا درخواستت را بنویس.");
  return;
 }

 if(q.length>3300){
  alert("لطفاً درخواست را کوتاه‌تر کن.");
  return;
 }

 button.disabled=true;
 button.textContent="در حال تحلیل و پردازش...";
 output.innerHTML="";

 const box=document.createElement("div");
 box.className="result";
 box.textContent="در حال ارتباط با هوش مصنوعی VENOM-X...";
 output.append(box);

 try{
  const text=q.toLowerCase()
   .replace(/ي/g,"ی")
   .replace(/ك/g,"ک");

  const categories={
   research:["تحقیق","جستجو","جست‌وجو","اینترنت","منبع","مقاله","اطلاعات","خبر","پیدا کن","مطالعه","research"],
   developer:["کد","برنامه","برنامه نویسی","برنامه‌نویسی","سایت","وب","اپلیکیشن","اپ","نرم افزار","نرم‌افزار","رفع خطا","باگ","پایتون","جاوا","html","developer"],
   analyst:["تحلیل","مقایسه","آمار","داده","ارزیابی","نتیجه","بررسی","گزارش","محاسبه","analyst"],
   strategist:["برنامه ریزی","برنامه‌ریزی","مدیریت","پروژه","استراتژی","هدف","زمان بندی","زمان‌بندی","اولویت","strategist"],
   creative:["ایده","محتوا","متن","داستان","موسیقی","آهنگ","شعر","طراحی","تصویر","سناریو","خلاقانه","creative"]
  };

  const matched=[];

  for(const [category,words] of Object.entries(categories)){
   if(words.some(word=>text.includes(word))){
    const agent=builtins.find(a=>a.id===category);
    if(agent) matched.push(agent);
   }
  }

  custom.forEach(agent=>{
   const words=(agent.name+" "+agent.role+" "+agent.task)
    .toLowerCase()
    .split(/[\s،,.]+/)
    .filter(w=>w.length>2);

   if(words.some(w=>text.includes(w)) &&
      !matched.some(a=>a.id===agent.id)){
    matched.push(agent);
   }
  });

  if(!matched.length){
   matched.push(builtins.find(a=>a.id==="analyst"));
  }

  const order={
   research:1,
   analyst:2,
   strategist:3,
   developer:4,
   creative:5
  };

  matched.sort((a,b)=>
   (order[a.id]||6)-(order[b.id]||6)
  );

  const teamText=matched.map(a=>
   `${a.name}: ${a.role}؛ وظیفه: ${a.task}`
  ).join("\n").slice(0,600);

  box.textContent="ایجنت‌ها انتخاب شدند. در انتظار پاسخ هوش مصنوعی...";

  const response=await fetch(
   "https://venom-x-ai.maneater081-2df.workers.dev/chat",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json"
    },
    body:JSON.stringify({
     message:
      "تخصص‌های انتخاب‌شده در سیستم:\n"+
      teamText+
      "\n\nدرخواست اصلی کاربر:\n"+
      q+
      "\n\nبا استفاده از تخصص‌های مرتبط، پاسخ نهایی و کاربردی را به فارسی ارائه بده."
    })
   }
  );

  const data=await response.json();

  if(!response.ok || !data.success){
   throw new Error(data.error || "ارتباط با هوش مصنوعی ناموفق بود.");
  }

  output.innerHTML="";

  const resultBox=document.createElement("div");
  resultBox.className="result";

  const title=document.createElement("strong");
  title.textContent="VENOM-X AI | پاسخ هوشمند";

  const team=document.createElement("p");
  team.textContent="ایجنت‌های انتخاب‌شده: "+
   matched.map(a=>a.name).join("، ");

  const answer=document.createElement("p");
  answer.style.whiteSpace="pre-wrap";
  answer.textContent=data.reply || "پاسخی دریافت نشد.";

  resultBox.append(title,team,answer);
  output.append(resultBox);

 }catch(error){
  output.innerHTML="";

  const errorBox=document.createElement("div");
  errorBox.className="result";
  errorBox.style.borderRightColor="#ff5364";
  errorBox.textContent="خطا در ارتباط با هوش مصنوعی: "+error.message;
  output.append(errorBox);

 }finally{
  button.disabled=false;
  button.textContent="تحلیل و انتخاب ایجنت‌ها";
 }
 }
load();
</script>
</body>
</html>
